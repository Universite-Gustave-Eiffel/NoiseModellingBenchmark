name: Benchmark & Deploy

on:
  push:
    branches:
      - main
      - benchmarkWebsiteGenerator-fixed
  workflow_dispatch:
    inputs:
      nm_version:
        description: 'Forcer une version NM (ex: 5.0.2). Vide = auto-detection depuis pom.xml.'
        required: false
        type: string
  schedule:
    - cron: '0 4 15 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  check-new-version:
    runs-on: ubuntu-latest
    outputs:
      new_version:  ${{ steps.detect.outputs.new_version }}
      has_new:      ${{ steps.detect.outputs.has_new }}
      artifact_url: ${{ steps.artifact.outputs.artifact_url }}
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}

    steps:
      - name: Checkout Benchmark repo
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GH_PAT }}
          

      - name: Detect new NM version from pom.xml
        id: detect
        run: |
          if [ -n "${{ inputs.nm_version }}" ]; then
            echo "new_version=${{ inputs.nm_version }}" >> $GITHUB_OUTPUT
            echo "has_new=true" >> $GITHUB_OUTPUT
            echo "Version forcée : v${{ inputs.nm_version }}"
            exit 0
          fi

          # Sur un push direct → pas de détection automatique
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "has_new=true" >> $GITHUB_OUTPUT
          fi

          POM=$(curl -sS -f \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/Universite-Gustave-Eiffel/NoiseModelling/contents/pom.xml?ref=main")
          
          if [ -z "$POM" ]; then
            echo "Impossible de récupérer pom.xml"
            echo "has_new=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          
          LATEST=$(echo "$POM" | grep -m1 '<version>' | \
            sed 's/.*<version>\(.*\)<\/version>.*/\1/' | tr -d '[:space:]' | \
            sed 's/-SNAPSHOT$//')
          
          echo "LATEST=[$LATEST]"

          
          if grep -q "$LATEST" .github/workflows/benchmark.yml 2>/dev/null; then
            echo "v${LATEST} déjà dans le benchmark."
            echo "has_new=false" >> $GITHUB_OUTPUT
          else
            echo "Nouvelle version : v${LATEST}"
            echo "new_version=$LATEST" >> $GITHUB_OUTPUT
            echo "has_new=true" >> $GITHUB_OUTPUT
          fi
        

      - name: Find artifact from latest run if successful
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        if: steps.detect.outputs.has_new == 'true'
        run: |
          NM_VERSION="${{ steps.detect.outputs.new_version }}"
          REPO="Universite-Gustave-Eiffel/NoiseModelling"
          CI_WORKFLOW_ID="5665989"
          
              
          LAST_RUN=$(curl -sS -f \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${REPO}/actions/workflows/${CI_WORKFLOW_ID}/runs?branch=main&status=success&per_page=1") 
          

          RUN_INFO=$(echo "$LAST_RUN" | python3 -c "
          import sys, json
          runs = json.load(sys.stdin).get('workflow_runs', [])
          if not runs:
              print('NONE'); sys.exit(0)
          r = runs[0]
          print(r['id'])
          print(r['conclusion'] or 'in_progress')
          ")

          RUN_ID=$(echo "$RUN_INFO" | sed -n '1p')
          CONCLUSION=$(echo "$RUN_INFO" | sed -n '2p')

          echo "Dernier run : id=$RUN_ID | conclusion=$CONCLUSION"

          # Si le dernier run n'est pas réussi → skip
          if [ "$RUN_ID" = "NONE" ] || [ "$CONCLUSION" != "success" ]; then
            echo "Dernier run non réussi (conclusion=$CONCLUSION) — artifact ignoré."
            echo "artifact_url=" >> $GITHUB_OUTPUT
            echo "artifact_name=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Run réussi — récupération de l'artifact..."

          ARTIFACTS=$(curl -sS -f \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Universite-Gustave-Eiffel/NoiseModelling/actions/runs/${RUN_ID}/artifacts")

          ARTIFACT_INFO=$(echo "$ARTIFACTS" | python3 -c "
          import sys, json
          arts = json.load(sys.stdin)
          for a in arts.get('artifacts', []):
              name = a['name']
              if name.startswith('NoiseModelling-'):
                print(a['id'])
                print(a['name'])
                print(a['archive_download_url'])
                break
          ")

          ARTIFACT_ID=$(echo "$ARTIFACT_INFO" | sed -n '1p')
          ARTIFACT_NAME=$(echo "$ARTIFACT_INFO" | sed -n '2p')
          ARTIFACT_URL=$(echo "$ARTIFACT_INFO" | sed -n '3p')

          if [ -z "$ARTIFACT_URL" ]; then
            echo "Aucun artifact NM trouvé."
            echo "artifact_url=" >> $GITHUB_OUTPUT
            echo "artifact_name=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Artifact : $ARTIFACT_NAME (id=$ARTIFACT_ID)"
          echo "artifact_url=$ARTIFACT_URL" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Download and prepare NM artifact
        if: steps.detect.outputs.has_new == 'true' && steps.artifact.outputs.artifact_url != ''
        run: |
          NM_VERSION="${{ steps.detect.outputs.new_version }}"
          ARTIFACT_URL="${{ steps.artifact.outputs.artifact_url }}"

          mkdir -p input

          echo "Téléchargement de l'artifact..."
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "$ARTIFACT_URL" \
            -o "input/NoiseModelling_v${NM_VERSION}_artifact.zip"

          ls -lh input/
          mkdir -p input/NoiseModelling_without_gui_v${NM_VERSION}_tmp
          unzip -q "input/NoiseModelling_v${NM_VERSION}_artifact.zip" \
            -d "input/NoiseModelling_without_gui_v${NM_VERSION}_tmp" || true

          INNER_ZIP=$(find "input/NoiseModelling_without_gui_v${NM_VERSION}_tmp" \
            -name "*.zip" | head -n 1)

          if [ -n "$INNER_ZIP" ]; then
            echo "Zip interne trouvé : $INNER_ZIP"
            mkdir -p "input/NoiseModelling_without_gui_v${NM_VERSION}"
            unzip -q "$INNER_ZIP" -d "input/NoiseModelling_without_gui_v${NM_VERSION}"
          else
            echo "Pas de zip interne — l'artifact est directement les fichiers NM"
            mv "input/NoiseModelling_without_gui_v${NM_VERSION}_tmp" \
               "input/NoiseModelling_without_gui_v${NM_VERSION}"
          fi

          echo "Structure extraite :"
          ls "input/NoiseModelling_without_gui_v${NM_VERSION}/"


      - name: Add new version to matrix and commit
        if: steps.detect.outputs.has_new == 'true' && steps.detect.outputs.new_version != ''
        run: |
          NM_VERSION="${{ steps.detect.outputs.new_version }}"
          python3 - "$NM_VERSION" << 'PYEOF'
          import sys, re
          version = sys.argv[1]
          key = f'v{version}'
          with open('.github/workflows/benchmark.yml') as f:
              content = f.read()
          pattern = r'(matrix:\s*\n\s*version:\s*\[)([^\]]*)(\])'
          match = re.search(pattern, content)
          if not match:
              print("Pattern matrix non trouvé")
              sys.exit(1)
          if key in match.group(2):
              print(f"{key} déjà présent")
              sys.exit(0)
          new_str = match.group(1) + match.group(2).rstrip() + f', {key}' + match.group(3)
          content = content[:match.start()] + new_str + content[match.end():]
          with open('.github/workflows/benchmark.yml', 'w') as f:
              f.write(content)
          print(f"{key} ajoutée dans la matrice")
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/benchmark.yml
          git commit -m "chore: add NoiseModelling v${NM_VERSION} to benchmark matrix [skip ci]" || true
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/Universite-Gustave-Eiffel/NoiseModellingBenchmark.git
          
          

  benchmark:
    needs: check-new-version
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        version: [v4.0.0, v4.0.1, v4.0.2, v4.0.4, v4.0.5, v5.0.0, v5.0.1, v6.0.0]
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Check disk space
        run: df -h

      - name: Check LW_ROADS.geojson
        run: |
          echo "File info:"
          file input/clisson/clisson/LW_ROADS.geojson
          echo "First lines:"
          head -5 input/clisson/clisson/LW_ROADS.geojson
      - name: Cache NM binary for ${{ matrix.version }}
        uses: actions/cache@v4
        with:
          path: input/NoiseModelling_without_gui_${{ matrix.version }}/
          key: nm-binary-${{ matrix.version }}

      - name: Restore artifact-based NM binary
        if: |
          needs.check-new-version.outputs.has_new == 'true' &&
          matrix.version == format('v{0}', needs.check-new-version.outputs.new_version)
        uses: actions/download-artifact@v4
        with:
          name: nm-artifact-${{ needs.check-new-version.outputs.new_version }}
          path: input/NoiseModelling_without_gui_${{ matrix.version }}/
        continue-on-error: true

      - name: Run benchmark for ${{ matrix.version }}
        run: bash -x benchmark_run.sh --version ${{ matrix.version }}

      - name: Check disk space after run
        if: always()
        run: df -h && du -sh input/ output/ 2>/dev/null | sort -rh

      - name: Show simulation log
        if: always()
        run: |
          find output -name simulation.log -exec sh -c 'echo ==== $1 ====; tail -100 "$1"' _ {} \;

      - name: Upload output for ${{ matrix.version }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.version }}
          path: output/${{ matrix.version }}/
          retention-days: 1

  build-website:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all outputs
        uses: actions/download-artifact@v4
        with:
          pattern: output-*
          path: output/
          merge-multiple: false

      - name: Fix artifact folder names
        run: |
          for d in output/output-*; do
            v=$(basename "$d" | sed 's/^output-//')
            mv "$d" "output/$v"
          done
          ls -la output/

      - name: Generate website
        run: bash benchmark_run.sh --aggregate-only

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/

  deploy:
    needs: build-website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
