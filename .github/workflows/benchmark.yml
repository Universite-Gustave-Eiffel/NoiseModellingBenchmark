name: Benchmark & Deploy

on:
  push:
    branches: 
    - main
    - benchmarkWebsiteGenerator-fixed
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check BUILDINGS.geojson
        run: |
          echo "File info:"
          file input/clisson/clisson/BUILDINGS.geojson
      
          echo "First lines:"
          head -5 input/clisson/clisson/BUILDINGS.geojson
      
          echo "Search version:"
          grep -n "version" input/clisson/clisson/BUILDINGS.geojson || true
    
      - name: Cache NM binaries only
        uses: actions/cache@v4
        with:
          path: input/NoiseModelling_*/
          key: nm-binaries-${{ hashFiles('benchmark_run.sh') }}
          restore-keys: nm-binaries-
      - name: Cache simulation outputs
        uses: actions/cache@v4
        with:
          path: output/
          key: nm-outputs-${{ hashFiles('benchmark_run.sh', 'nm_v5.0/src/main/groovy/**') }}
          restore-keys: nm-outputs-

      - name: Run benchmark
        run: |
          bash -x benchmark_run.sh
      - name: Show simulation logs
        if: always()
        run: |
          find output -name simulation.log -exec sh -c 'echo ==== $1 ====; tail -100 "$1"' _ {} \;
    


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/

  deploy:
    needs: benchmark
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
