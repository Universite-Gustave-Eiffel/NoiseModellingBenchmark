name: Benchmark & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache input data
        uses: actions/cache@v4
        with:
          path: input/
          key: nm-inputs-${{ hashFiles('benshmark_run.sh') }}
          restore-keys: nm-inputs-
      - name: Cache simulation outputs
        uses: actions/cache@v4
        with:
          path: output/
          key: nm-outputs-${{ hashFiles('benshmark_run.sh', 'nm_v5.0/src/main/groovy/**') }}
          restore-keys: nm-outputs-

      - name: Run benchmark
        run: bash benshmark_run.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/

  deploy:
    needs: benchmark
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
