name: Benchmark & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache NM binaries only
        uses: actions/cache@v4
        with:
          path: input/NoiseModelling_*/
          key: nm-binaries-${{ hashFiles('benchmark_run.sh') }}
          restore-keys: nm-binaries-
      - name: Cache simulation outputs
        uses: actions/cache@v4
        with:
          path: output/
          key: nm-outputs-${{ hashFiles('benchmark_run.sh', 'nm_v5.0/src/main/groovy/**') }}
          restore-keys: nm-outputs-

      - name: Run benchmark
        run: bash benchmark_run.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/

  deploy:
    needs: benchmark
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
